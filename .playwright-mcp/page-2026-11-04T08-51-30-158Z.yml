        - heading "Szanujemy Twoją prywatność" [level=2] [ref=f9e497]
      - generic [ref=f9e499]:
        - text: Razem z naszymi 1540 partnerami przechowujemy na urządzeniu informacje, takie jak pliki cookie, i uzyskujemy do nich dostęp, a także przetwarzamy dane osobowe, takie jak niepowtarzalne identyfikatory i standardowe informacje wysyłane przez urządzenie, w celu zapewniania spersonalizowanych reklam i treści, pomiaru reklam i treści oraz zbierania opinii odbiorców, a także rozwijania i ulepszania produktów. Za Twoją zgodą my i nasi
        - button "partnerzy" [ref=f9e500] [cursor=pointer]
        - text: możemy wykorzystywać precyzyjne dane geolokalizacyjne i identyfikację przez skanowanie urządzeń. Możesz kliknąć, aby wyrazić zgodę na przetwarzanie danych przez nas i naszych partnerów zgodnie z opisem powyżej. Możesz też uzyskać dostęp do bardziej szczegółowych informacji i zmienić swoje preferencje przed wyrażeniem zgody lub odmówić jej wyrażenia. Pamiętaj, że niektóre rodzaje przetwarzania danych osobowych mogą nie wymagać Twojej zgody, ale masz prawo sprzeciwić się takiemu przetwarzaniu. Twoje preferencje będą mieć zastosowanie tylko do tej witryny. Możesz w dowolnym momencie zmienić swoje preferencje lub wycofać zgodę, wracając na tę stronę i klikając przycisk "Prywatność" na dole strony.
