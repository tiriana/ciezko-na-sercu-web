            - generic [ref=f34e92]: Opis audycji
            - paragraph [ref=f34e94]: Audycja dla wszystkich, którym serce bije szybciej przy szeroko pojmowanej muzyce ekstremalnej, ciężkiej, brutalnej. Tu gra metal w pełnym swoim spektrum, od liczącego pół wieku z okładem kanonu po tych, co dziś poszerzają granice gatunku łącząc go z elektroniką, jazzem czy muzyką źródeł. W środę od 0:05 do 2:00, znajdujemy też miejsce na dźwięki metalowe raczej z ducha niż z brzmienia, wynalazki muzycznych szarlatanów z kraju i ze świata.
