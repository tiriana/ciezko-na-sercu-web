# Odświeżanie katalogu odcinków prosto ze strony audycji.
#
# Lista odcinków i adresy audio są na polskieradio.pl, więc nie ma pośrednika:
# `scripts/fetch-episodes.mjs` czyta paginację serwisu, `build-catalog.mjs` liczy katalog.
# Commit trafia do main, a deploy publikuje zmianę.
#
# Uruchamiany:
#   1. ręcznie (workflow_dispatch);
#   2. ze środowego workflow wykrywającego nowy odcinek (#43).

name: Odśwież katalog

on:
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Symulacja: opublikuj mimo braku zmian (transkrypcji nie zamawiam)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Pobierz listę odcinków ze strony audycji
        run: node scripts/fetch-episodes.mjs .cache/episodes.json

      - name: Przelicz katalog
        run: node scripts/build-catalog.mjs .cache/episodes.json data/catalog.json

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź spójność danych
        run: node scripts/check-data.mjs

      - name: Zapisz zmiany
        id: commit
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "Katalog bez zmian"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "Katalog odcinków: odświeżenie ze strony audycji ($(date -u +%Y-%m-%d))"
          # main żyje własnym życiem (wydania, transkrypcje), więc przed push-em
          # dopasowujemy się do zdalnego, a przy wyścigu próbujemy jeszcze raz.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      # Push wykonany GITHUB_TOKEN-em nie uruchamia innych workflowów, więc deploy odpalamy
      # jawnie — workflow_dispatch jest jedynym wyjątkiem od tej reguły. Symulacja także
      # publikuje, żeby dało się sprawdzić całą ścieżkę bez nowego odcinka.
      - name: Opublikuj stronę
        if: steps.commit.outputs.changed == 'true' || inputs.simulate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f version="$(node -p 'require("./package.json").version')"

      # Nowy odcinek ma pierwszeństwo przed kolejką, więc transkrypcję zamawiamy od razu
      # po odświeżeniu katalogu. Plan bierze najnowszy odcinek bez transkryptu.
      # Symulacja jej nie zamawia: to godziny pracy runnerów na materiale, który i tak
      # trafi do kolejki.
      - name: Zamów transkrypcję nowego odcinka
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run transcribe-daily.yml --ref main
