# Odświeżanie katalogu odcinków prosto ze strony audycji.
#
# Lista odcinków i adresy audio są na polskieradio.pl, więc nie ma pośrednika:
# `scripts/fetch-episodes.mjs` czyta paginację serwisu, `build-catalog.mjs` liczy katalog.
# Commit trafia do main, a deploy publikuje zmianę.
#
# Uruchamiany:
#   1. ręcznie (workflow_dispatch);
#   2. ze środowego workflow wykrywającego nowy odcinek (#43).

name: Odśwież katalog

on:
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Symulacja: opublikuj mimo braku zmian (transkrypcji nie zamawiam)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Pobierz listę odcinków ze strony audycji
        run: node scripts/fetch-episodes.mjs .cache/episodes.json

      - name: Przelicz katalog
        run: node scripts/build-catalog.mjs .cache/episodes.json data/catalog.json

      # Wpis ma się pojawić od razu, a tracklista dojdzie po transkrypcji — dlatego
      # każdy odcinek bez pliku opracowania dostaje zaślepkę z pustym programem.
      - name: Utwórz zaślepki opracowań
        run: node scripts/stub-episodes.mjs

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź spójność danych
        run: node scripts/check-data.mjs

      - name: Zapisz zmiany
        id: commit
        run: |
          bash scripts/push-data.sh "Katalog odcinków: odświeżenie ze strony audycji ($(date -u +%Y-%m-%d))" data/catalog.json data/episodes

      # Push wykonany GITHUB_TOKEN-em nie uruchamia innych workflowów, więc deploy odpalamy
      # jawnie — workflow_dispatch jest jedynym wyjątkiem od tej reguły. Symulacja także
      # publikuje, żeby dało się sprawdzić całą ścieżkę bez nowego odcinka.
      - name: Opublikuj stronę
        if: steps.commit.outputs.changed == 'true' || inputs.simulate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f version="$(node -p 'require("./package.json").version')"

      # Nowy odcinek ma pierwszeństwo przed kolejką, więc od razu po odświeżeniu katalogu
      # liczymy dla niego bloki mowy. To tanie i jest wejściem dla transkrypcji (cięcie na
      # mowę) i dla Shazama (muzyka to dopełnienie mowy) — dlatego `spans` zamawia
      # transkrypcję sam, po commicie artefaktu.
      # Symulacja niczego nie zamawia: to praca runnerów na materiale z kolejki.
      - name: Zamów bloki mowy dla nowego odcinka
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run spans.yml --ref main
