# Odświeżanie katalogu odcinków z Egnyte.
#
# Katalog czyta wyłącznie workflow publikujący — tutaj tylko pobieramy episodes.json z serwera
# i zapisujemy przeliczony data/catalog.json. Commit trafia do main, a push uruchamia deploy.
#
# Uruchamiany:
#   1. w środę 04:00 UTC, dwie godziny po pobieraniu nowych odcinków (02:00 UTC);
#   2. zdarzeniem repository_dispatch (typ: catalog-refresh) z repozytorium downloadera;
#   3. ręcznie (workflow_dispatch).

name: Odśwież katalog

on:
  schedule:
    - cron: '0 4 * * 3'
  repository_dispatch:
    types: [catalog-refresh]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

env:
  PROGRAM_DIR: 'Ciężko na Sercu'

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Zainstaluj rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Pobierz episodes.json z Egnyte
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          RADIO_DIR: ${{ vars.RADIO_DIR || '/Shared/Radio' }}
        run: |
          mkdir -p .cache
          # Sekret bywa zapisany z końcowym dwukropkiem (tak wypisuje go `rclone config string`),
          # a wtedy `...::/Shared/...` znaczy „pusta ścieżka" i rclone zgłasza brak katalogu.
          REMOTE="${RCLONE_REMOTE%:}"
          rclone copy "$REMOTE:$RADIO_DIR/$PROGRAM_DIR/episodes.json" .cache

      - name: Przelicz katalog
        run: node scripts/build-catalog.mjs .cache/episodes.json data/catalog.json

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź spójność danych
        run: node scripts/check-data.mjs

      - name: Zapisz zmiany
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "Katalog bez zmian"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "Katalog odcinków: odświeżenie z Egnyte ($(date -u +%Y-%m-%d))"
          # main żyje własnym życiem (wydania, transkrypcje), więc przed push-em
          # dopasowujemy się do zdalnego, a przy wyścigu próbujemy jeszcze raz.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then exit 0; fi
            sleep 5
          done
          exit 1

      # Push wykonany GITHUB_TOKEN-em nie uruchamia innych workflowów, więc deploy odpalamy
      # jawnie — workflow_dispatch jest jedynym wyjątkiem od tej reguły.
      - name: Opublikuj stronę
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f version="$(node -p 'require("./package.json").version')"

      # Nowy odcinek ma pierwszeństwo przed kolejką, więc transkrypcję zamawiamy od razu
      # po odświeżeniu katalogu. Plan bierze najnowszy odcinek bez transkryptu.
      - name: Zamów transkrypcję nowego odcinka
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run transcribe-daily.yml --ref main
