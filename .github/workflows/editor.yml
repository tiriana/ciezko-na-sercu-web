name: editor

# Edytor online (`editor/`) to osobny projekt Cloudflare Pages: statyczne pliki bez
# backendu, więc publikacja to build + upload. Wersja strony głównej się nie zmienia,
# a ten deploy jej nie dotyka.

on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'lib/**'
      - 'scripts/build-editor.mjs'
      - '.github/workflows/editor.yml'
  workflow_dispatch:

run-name: edytor online

permissions:
  contents: read

concurrency:
  group: editor
  cancel-in-progress: true

env:
  CF_PROJECT: ciezko-edytor
  WRANGLER_VERSION: 4.157.0
  # main to produkcja, gałęzie robocze mają własny podgląd — test dymny musi pytać
  # ten adres, który właśnie powstał, a nie produkcję.
  EDITOR_URL: ${{ github.ref_name == 'main' && 'https://ciezko-edytor.pages.dev' || format('https://{0}.ciezko-edytor.pages.dev', github.ref_name) }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true

      - name: Zainstaluj zależności
        run: npm ci

      - name: Zainstaluj przeglądarkę do testów
        run: npx playwright install --with-deps chromium

      - name: Testy wspólnych modułów
        run: |
          npm run test:overrides
          npm run test:aliases
          npm run test:tags

      - name: Zbuduj edytor
        run: npm run editor:build

      - name: Test edytora (atrapa GitHuba i raw)
        run: npm run test:editor

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true

      - name: Zbuduj edytor
        run: node scripts/build-editor.mjs

      - name: Opublikuj na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts)
            CLOUDFLARE_ACCOUNT_ID=$(echo "$response" | jq -r '.result[0].id // empty')
            if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "::error::Nie udało się ustalić numeru konta Cloudflare: $response"
              exit 1
            fi
            export CLOUDFLARE_ACCOUNT_ID
          fi
          npx --yes wrangler@$WRANGLER_VERSION pages project create "$CF_PROJECT" \
            --production-branch=main || true
          npx --yes wrangler@$WRANGLER_VERSION pages deploy .cache/editor-dist \
            --project-name "$CF_PROJECT" --branch="$GITHUB_REF_NAME" --commit-dirty=true

      - name: Test dymny edytora
        # Edytor bywa jedynym sposobem edycji, więc sprawdzamy, że po deployu odpowiada
        # i faktycznie serwuje aplikację (a nie stronę błędu Cloudflare).
        run: |
          set -uo pipefail
          body=$(mktemp)
          for attempt in $(seq 1 18); do
            code=$(curl -sSL --max-time 20 -o "$body" -w '%{http_code}' "$EDITOR_URL/" || echo 000)
            if [ "$code" = 200 ] && grep -q 'id="publish"' "$body" && grep -q 'src="./app.js"' "$body"; then
              echo "Edytor odpowiada (próba $attempt)."
              rm -f "$body"
              exit 0
            fi
            if [ "$attempt" = 18 ]; then
              echo "::error::Edytor nie odpowiada poprawnie: HTTP $code"
              rm -f "$body"
              exit 1
            fi
            echo "Próba $attempt/18 — czekam 10 s (HTTP $code)"
            sleep 10
          done
