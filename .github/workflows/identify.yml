name: identify

# Rozpoznawanie utworów Shazamem. Blok muzyki to dopełnienie okien mowy
# z transkryptu, więc etap idzie po transkrypcji — bez niej nie ma czego odjąć.
# Dla nowego odcinka zamawia go `transcribe.yml` po commicie danych; ręcznie można
# wskazać odcinki albo puścić zaległość (`force` nadpisuje istniejące utwory).
#
# Shazam chodzi po nieoficjalnym endpoincie i przy zbyt wielu zapytaniach odpowiada
# stroną HTML zamiast JSON-em. Skrypt ponawia z rosnącym oddechem, a blok, który
# mimo to nie zostanie rozpoznany, po prostu nie dostaje utworu.

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: 'UUID lub slugi oddzielone przecinkami; puste = odcinki bez utworów'
        required: false
        type: string
      limit:
        description: 'Ile odcinków najwyżej (0 = bez limitu)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Licz też odcinki, które już mają utwory'
        required: false
        default: false
        type: boolean
      grid:
        description: 'Siatka sond w sekundach (0 = jedna piosenka na blok)'
        required: false
        default: '60'
        type: string

run-name: "rozpoznawanie utworów: ${{ inputs.episodes || 'odcinki bez utworów' }}"

permissions:
  contents: write
  actions: write

concurrency:
  group: identify
  cancel-in-progress: false

jobs:
  identify:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ffmpeg wycina próbki po HTTP (range requests), ffprobe mierzy długość nagrania.
      - name: Zainstaluj ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci

      - name: Rozpoznaj utwory
        env:
          EPISODES: ${{ inputs.episodes }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
          GRID: ${{ inputs.grid }}
        run: |
          extra=(--spans-dir data/artifacts --grid "${GRID:-60}")
          if [ -n "$EPISODES" ]; then extra+=(--episodes "$EPISODES"); fi
          if [ "$LIMIT" != "0" ]; then extra+=(--limit "$LIMIT"); fi
          if [ "$FORCE" = "true" ]; then extra+=(--force); fi
          node scripts/identify-tracks.mjs "${extra[@]}" --write | tee identify.log
          {
            echo "### Rozpoznawanie utworów"
            echo ""
            echo '```'
            tail -40 identify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Shazam nie zna całego polskiego undergroundu, więc bloki bez trafienia dostają
      # `#TODO`. Ten krok czyta zapowiedź z transkryptu, bierze kandydatów z Deezera
      # i potwierdza ich chromą — zapisuje tylko to, co zgadza się z dźwiękiem.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: '3.12'

      - name: Zainstaluj numpy
        run: pip install --quiet numpy

      - name: Rozpoznaj nierozpoznane utwory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EPISODES: ${{ inputs.episodes }}
        run: |
          args=(--all)
          if [ -n "$EPISODES" ]; then
            args=()
            for id in ${EPISODES//,/ }; do args+=(--episode "$id"); done
          fi
          python3 scripts/resolve_tracks.py "${args[@]}" --write

      - run: npm run check

      # Shazam kosztuje kilka minut próbek, więc wynik jedzie do artefaktu —
      # po nieudanym commicie nie trzeba rozpoznawać od nowa.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: identify-data
          path: |
            data/episodes/*.json
            data/overrides/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit
        run: |
          bash scripts/push-data.sh "fix: rozpoznane utwory Shazamem (${GITHUB_RUN_ID})" data/episodes data/overrides

      - name: Stan etapów
        if: always()
        run: node scripts/status-all.mjs

      # Push z GITHUB_TOKEN nie uruchamia workflow, więc deploy zamawiamy ręcznie.
      - name: Deploy po aktualizacji danych
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -f version="$(node -p 'require("./package.json").version')"
