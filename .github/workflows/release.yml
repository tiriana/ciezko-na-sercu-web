name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

# Wersja powstaje z typów commitów, więc dwa przebiegi naraz policzyłyby ją dwa razy.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Commit z podbitą wersją powstał z tokena Actions, więc sam nie uruchomi deployu.
      # Dispatch przechodzi przez tę blokadę i publikuje stronę już z nowym numerem.
      # `always()`: awaria wersjonowania nie może zatrzymać publikacji kodu — deploy
      # pójdzie z numerem, jaki akurat leży w `package.json`.
      - name: Deploy po wydaniu
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -f version="$(node -p "require('./package.json').version")"
