name: tytuły odcinków

# Radio publikuje odcinek z tytułem technicznym („Ciężko na sercu 11 listopada
# godz. 00:06”), a redakcja podmienia go na własny po kilku dniach albo tygodniach.
# Ten workflow sprawdza świeże odcinki i przenosi tytuł redakcyjny do katalogu.
# Starsze odcinki pomijamy — ich tytuły się nie zmieniają, a zmiana przestawiłaby slug.

on:
  schedule:
    - cron: '10 5 * * 1'
  workflow_dispatch:

run-name: "tytuły: sprawdzenie odcinków z ostatniego miesiąca"

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-titles
  cancel-in-progress: false

jobs:
  titles:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - run: npm ci

      - name: Sprawdź tytuły na stronie radia
        run: node scripts/refresh-titles.mjs

      - run: npm run check

      - name: Commit
        run: |
          bash scripts/push-data.sh "chore(data): tytuły redakcyjne z radia (${GITHUB_RUN_ID})" data/catalog.json data/catalog-titles.json

      - name: Deploy po aktualizacji danych
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -f version="$(node -p 'require("./package.json").version')"
