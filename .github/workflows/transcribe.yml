name: transcribe

# Ponowna transkrypcja wybranych odcinków gęstszymi segmentami (`-ml 20 -sow`).
# Liczy się w darmowych minutach publicznego repo, więc ciężka praca nie zajmuje
# lokalnego komputera. Wynik to data/transcripts/<uuid>.json — dalsze kroki
# (przyciąganie tematów do segmentów, import) robi się lokalnie.

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: 'UUID lub slugi oddzielone przecinkami; puste = wszystkie'
        required: false
        type: string
      max_len:
        description: 'Maksymalna długość segmentu w znakach (-ml)'
        required: false
        default: '20'
        type: string
      split_on_word:
        description: 'Dziel po słowie (-sow)'
        required: false
        default: true
        type: boolean
      vad:
        description: 'VAD whispera (obcina ~40% tekstu — zostaw wyłączone)'
        required: false
        default: false
        type: boolean
      limit:
        description: 'Ile odcinków najwyżej (0 = bez limitu)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Licz też odcinki już zrobione tymi parametrami'
        required: false
        default: false
        type: boolean
      label:
        description: 'Etykieta przebiegu (tytuł odcinka)'
        required: false
        type: string
      source:
        description: 'Skąd bierze się podział: spans (bloki mowy) albo time (równe kawałki)'
        required: false
        default: 'spans'
        type: string

run-name: "transkrypcja: ${{ inputs.label || inputs.episodes || 'wszystkie odcinki' }}"

permissions:
  contents: write
  actions: write

concurrency:
  group: transcribe
  cancel-in-progress: false

env:
  WHISPER_VERSION: v1.9.5
  WHISPER_MODEL: ggml-large-v3-turbo-q5_0.bin
  WHISPER_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
  THREADS: '4'

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Długość audio bierzemy z pliku, a nie z transkryptu — potrzebny ffprobe.
      - name: Zainstaluj ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - id: build
        env:
          EPISODES: ${{ inputs.episodes }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
          MAX_LEN: ${{ inputs.max_len }}
          SPLIT_ON_WORD: ${{ inputs.split_on_word }}
          VAD: ${{ inputs.vad }}
          SOURCE: ${{ inputs.source }}
        run: node scripts/plan-transcribe.mjs

  transcribe:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      MAX_LEN: ${{ inputs.max_len }}
      SPLIT_ON_WORD: ${{ inputs.split_on_word }}
      VAD: ${{ inputs.vad }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Obraz ubuntu-24.04 nie ma ffmpeg w PATH, a skrypt przycina nim audio.
      - name: Zainstaluj ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache whisper.cpp
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/whisper
          # Bez `-generic` w kluczu cache trzymał binarkę zbudowaną pod AVX-512
          # i wywalał się z SIGILL na runnerze bez tych instrukcji.
          key: whisper-${{ env.WHISPER_VERSION }}-${{ runner.arch }}-generic

      - name: Build whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp.git .cache/whisper/src
          # `GGML_NATIVE=OFF` daje kod pod baseline x86-64 zamiast pod CPU, który akurat
          # zbudował cache — inaczej binarka z młodszego runnera pada z SIGILL na starszym.
          cmake -S .cache/whisper/src -B .cache/whisper/src/build \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF
          cmake --build .cache/whisper/src/build -j 4 --target whisper-cli
          mkdir -p .cache/whisper/bin
          cp -a .cache/whisper/src/build/bin/. .cache/whisper/bin/

      - name: Cache model
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/models
          key: model-${{ env.WHISPER_MODEL }}

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/models
          curl -sSL -o ".cache/models/$WHISPER_MODEL" "$WHISPER_MODEL_URL"

      - name: Transcribe
        env:
          WHISPER_BIN: ${{ github.workspace }}/.cache/whisper/bin/whisper-cli
          WHISPER_MODEL_PATH: ${{ github.workspace }}/.cache/models/${{ env.WHISPER_MODEL }}
          ID: ${{ matrix.id }}
          URL: ${{ matrix.audioUrl }}
          START: ${{ matrix.start }}
          LENGTH: ${{ matrix.length }}
          CHUNK_FROM: ${{ matrix.chunkFrom }}
          CHUNK_TO: ${{ matrix.chunkTo }}
          PART: ${{ matrix.part }}
        run: |
          # Macierz z bloków mowy podaje zakres bloków; tryb `time` (starszy) podaje czas.
          if [ -n "$CHUNK_FROM" ]; then
            WHISPER_BIN="$WHISPER_BIN" \
            WHISPER_MODEL="$WHISPER_MODEL_PATH" \
            node scripts/transcribe.mjs --id "$ID" --url "$URL" \
              --chunks "data/artifacts/$ID/speech-spans.json" \
              --chunk-from "$CHUNK_FROM" --chunk-to "$CHUNK_TO" \
              --part "$PART" --out .incoming
          else
            WHISPER_BIN="$WHISPER_BIN" \
            WHISPER_MODEL="$WHISPER_MODEL_PATH" \
            node scripts/transcribe.mjs --id "$ID" --url "$URL" \
              --start "$START" --length "$LENGTH" --part "$PART" --out .incoming
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: transcript-${{ matrix.id }}-${{ matrix.part }}
          path: .incoming/${{ matrix.id }}.part*.json
          # v7 domyślnie pomija pliki z katalogów zaczynających się kropką,
          # a `.incoming` jest właśnie takim katalogiem — bez tego nic się nie wysyła.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: [plan, transcribe]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: transcript-*
          path: .incoming
          merge-multiple: true

      # Wszystkie części muszą być na miejscu: scalona transkrypcja z dziurą
      # wygląda jak gotowa i nigdy nie wróci do kolejki.
      - name: Sprawdź komplet części
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          node -e '
            const fs = require("node:fs");
            const matrix = JSON.parse(process.env.MATRIX || "[]");
            const expected = [...new Set(matrix.map((job) => `${job.id}.part${String(job.part).padStart(3, "0")}.json`))];
            const present = new Set(fs.existsSync(".incoming") ? fs.readdirSync(".incoming") : []);
            const missing = expected.filter((name) => !present.has(name));
            if (missing.length > 0) {
              console.log(`::error::Brakuje części transkryptu: ${missing.join(", ")} — uruchom ponownie nieudane zadania.`);
              process.exit(1);
            }
            console.log(`Komplet ${expected.length} części na miejscu.`);
          '

      - name: Złóż części
        run: node scripts/merge-transcripts.mjs .incoming data/transcripts

      - name: Przelicz czasy tematów
        run: node scripts/snap-topics.mjs

      - name: Przytnij końce utworów do początku mowy
        run: node scripts/snap-boundaries.mjs

      - run: npm ci
      - run: npm run check

      - name: Commit
        id: commit
        run: |
          bash scripts/push-data.sh "fix: transkrypcja i przeliczone czasy tematów (${GITHUB_RUN_ID})" data/transcripts data/episodes

      - name: Stan etapów
        if: always()
        run: node scripts/status-all.mjs

      # Świeży transkrypt to jedyny moment, w którym profil głosu ma z czego
      # zrobić etykiety — dlatego domykamy wejścia od razu, bez czekania na noc.
      - name: Domykaj wejścia profilem głosu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          ids=$(node scripts/matrix-ids.mjs)
          if [ -z "$ids" ]; then
            echo "Brak odcinków do domknięcia."
            exit 0
          fi
          echo "Profil głosu dla: $ids"
          gh workflow run nightly.yml --ref main -f stage=voiceprint -f episodes="$ids" -f limit=0 -f apply=true

      # Shazam potrzebuje tylko audio i bloków mowy, więc idzie zaraz po transkrypcie;
      # bez tego nowy odcinek zostaje bez ani jednego utworu.
      - name: Rozpoznaj utwory Shazamem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          ids=$(node scripts/matrix-ids.mjs)
          if [ -z "$ids" ]; then
            echo "Brak odcinków do rozpoznania."
            exit 0
          fi
          echo "Shazam dla: $ids"
          gh workflow run identify.yml --ref main -f episodes="$ids" -f limit=0

      # Deploy na końcu: nieudany dispatch publikacji nie może zatrzymać etapów,
      # które mają już dane pod ręką. Gdy commit nic nie zmienił, build zbędny.
      - name: Deploy po aktualizacji danych
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -f version="$(node -p 'require("./package.json").version')"
