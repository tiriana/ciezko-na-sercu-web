name: rollback

# Cofnięcie produkcji do wcześniejszego wdrożenia Cloudflare Pages.
# Identyfikatory wdrożeń wypisuje (od najnowszego):
#   npx --yes wrangler@4.157.0 pages deployment list --project-name ciezko-na-sercu
# albo ręcznie z API: GET /accounts/<konto>/pages/projects/ciezko-na-sercu/deployments

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: 'Id wdrożenia Pages do przywrócenia (UUID; lista: npx --yes wrangler@4.157.0 pages deployment list --project-name ciezko-na-sercu)'
        required: true
        type: string
      reason:
        description: 'Powód cofnięcia — trafia do podsumowania przebiegu'
        required: false
        type: string

run-name: rollback ${{ inputs.deployment }}

permissions:
  contents: read

env:
  CF_PROJECT: ciezko-na-sercu
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  rollback:
    # Produkcja jest jedna; z innej gałęzi cofanie nie ma sensu.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ustal numer konta Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            response=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$CF_API/accounts")
            CLOUDFLARE_ACCOUNT_ID=$(echo "$response" | jq -r '.result[0].id // empty')
            if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "::error::Nie udało się ustalić numeru konta Cloudflare. Ustaw zmienną repozytorium CLOUDFLARE_ACCOUNT_ID. Odpowiedź API: $response"
              exit 1
            fi
            echo "Numer konta wykryty z API: $CLOUDFLARE_ACCOUNT_ID"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Wypisz ostatnie wdrożenia produkcyjne
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          deployments=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments?env=production&per_page=100")
          echo "$deployments" \
            | jq -r '.result[] | "\(.id)  \(.created_on)  \(.deployment_trigger.metadata.commit_hash[0:12])  \(.latest_stage.status)"' \
            | tee /tmp/deployments.txt
          if ! grep -q "^$DEPLOYMENT_ID" /tmp/deployments.txt; then
            echo "::warning::$DEPLOYMENT_ID nie ma na liście 100 ostatnich wdrożeń produkcyjnych — sprawdź identyfikator, ale próbuję dalej."
          fi
          commit=$(echo "$deployments" \
            | jq -r --arg id "$DEPLOYMENT_ID" '.result[] | select(.id == $id) | .deployment_trigger.metadata.commit_hash // empty' \
            | head -1)
          echo "ROLLBACK_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Cofnij wdrożenie
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
        run: |
          # POST /accounts/{account_id}/pages/projects/{project_name}/deployments/{deployment_id}/rollback
          # Bez ciała żądania — identyfikator wdrożenia jest w ścieżce.
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT/deployments/$DEPLOYMENT_ID/rollback")
          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare odrzucił cofnięcie: $response"
            exit 1
          fi
          echo "Cofnięto do wdrożenia: $(echo "$response" | jq -r '.result.url // .result.id')"
          if [ -z "$ROLLBACK_COMMIT" ]; then
            echo "ROLLBACK_COMMIT=$(echo "$response" | jq -r '.result.deployment_trigger.metadata.commit_hash // empty')" >> "$GITHUB_ENV"
          fi

      - name: Test dymny po cofnięciu
        env:
          BASE_URL: https://ciezko-na-sercu.pages.dev
          EPISODE_PATH: /odcinki/2024-05-01-ciezko-na-sercu-1-maja-godz-0005/
        run: |
          set -uo pipefail
          expected=""
          if [ -n "${ROLLBACK_COMMIT:-}" ]; then
            # Wersja liczona z package.json w commicie, z którego powstało wdrożenie.
            expected=$(curl -fsS --max-time 20 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$ROLLBACK_COMMIT/package.json" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || true)
          fi
          if [ -z "$expected" ]; then
            echo "::warning::Nie udało się ustalić wersji z commita wdrożenia — sprawdzam tylko odpowiedzi HTTP."
          else
            echo "Oczekiwana wersja: $expected"
          fi

          body=$(mktemp)
          for attempt in $(seq 1 18); do
            problems=""

            home_code=$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$BASE_URL/" || echo 000)
            if [ "$home_code" != 200 ]; then
              problems="$problems strona główna: HTTP $home_code."
            else
              if [ -n "$expected" ]; then
                grep -qF ">$expected</a>" "$body" \
                  || problems="$problems w stopce brak wersji $expected."
              fi
              asset=$(grep -o '/_astro/[^"]*' "$body" | head -1)
              if [ -z "$asset" ]; then
                problems="$problems strona główna nie wskazuje pliku /_astro/."
              else
                asset_code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL$asset" || echo 000)
                [ "$asset_code" = 200 ] || problems="$problems $asset: HTTP $asset_code."
              fi
            fi

            episode_code=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL$EPISODE_PATH" || echo 000)
            [ "$episode_code" = 200 ] || problems="$problems $EPISODE_PATH: HTTP $episode_code."

            if [ -z "$problems" ]; then
              live=$(grep -oE 'releases/tag/v[0-9A-Za-z.+-]+' "$body" | head -1 | sed 's|.*/v||')
              echo "Produkcja odpowiada (próba $attempt). Wersja na stronie: ${live:-nieodczytana}"
              echo "LIVE_VERSION=${live:-nieodczytana}" >> "$GITHUB_ENV"
              rm -f "$body"
              exit 0
            fi
            if [ "$attempt" = 18 ]; then
              echo "::error::Produkcja nie przeszła testu dymnego po cofnięciu po 3 minutach:$problems"
              rm -f "$body"
              exit 1
            fi
            echo "Próba $attempt/18 — czekam 10 s:$problems"
            sleep 10
          done

      - name: Podsumuj cofnięcie
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Cofnięcie wdrożenia"
            echo ""
            echo "1. Wdrożenie: \`$DEPLOYMENT_ID\`"
            echo "1. Commit wdrożenia: \`${ROLLBACK_COMMIT:-nieustalony}\`"
            echo "1. Wersja na stronie po cofnięciu: \`${LIVE_VERSION:-nieustalona}\`"
            if [ -n "$REASON" ]; then
              echo "1. Powód: $REASON"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
