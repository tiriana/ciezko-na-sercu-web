name: preview

# Podgląd pracy nad gałęziami: osobny adres na Cloudflare Pages, main i produkcja bez zmian.
on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PROJECT: ciezko-na-sercu
  WRANGLER_VERSION: 4.157.0

jobs:
  preview:
    runs-on: ubuntu-26.04
    env:
      # Każda gałąź ma własny adres podglądu: ukośniki w nazwie Cloudflare zamienia na myślniki.
      CF_BRANCH: ${{ github.ref_name }}
      STAGING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Zainstaluj zależności
        run: npm ci

      - name: Zbuduj stronę
        run: npm run build

      - name: Opublikuj podgląd na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
            CLOUDFLARE_ACCOUNT_ID=$(echo "$response" | jq -r '.result[0].id // empty')
            export CLOUDFLARE_ACCOUNT_ID
          fi
          npx --yes wrangler@$WRANGLER_VERSION pages deploy dist \
            --project-name "$CF_PROJECT" --branch="$CF_BRANCH" --commit-dirty=true
          echo "Podgląd: https://$(echo "$CF_BRANCH" | tr '/' '-').$CF_PROJECT.pages.dev"
