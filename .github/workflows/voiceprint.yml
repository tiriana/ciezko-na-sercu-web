name: voiceprint

# Profil głosu prowadzącego i domykanie wejść — całość na GitHubie:
# Silero VAD + embeddingi ECAPA, potem import nowych i wydłużonych wejść
# do data/overrides, commit i deploy. Rejestr data/voiceprint.json mówi,
# które odcinki są już przerobione; odcinki z „ok” czekają na FORCE.

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: 'UUID lub slugi oddzielone przecinkami; puste = kolejka'
        required: false
        type: string
      limit:
        description: 'Ile odcinków w tym przebiegu (0 = bez limitu)'
        required: false
        default: '20'
        type: string
      force:
        description: 'Ruszaj też odcinki z oznaczeniami „ok”'
        required: false
        default: false
        type: boolean
      parallel:
        description: 'Ile odcinków liczyć równolegle'
        required: false
        default: '4'
        type: string
      apply:
        description: 'Zapisz wejścia do danych i wdróż (bez tego tylko artefakt)'
        required: false
        default: true
        type: boolean
  schedule:
    # Codziennie po porannej transkrypcji: dokłada nowe odcinki do kolejki.
    - cron: '30 4 * * *'

run-name: "profil głosu: ${{ inputs.episodes || 'kolejka' }}"

permissions:
  contents: write
  actions: write

concurrency:
  group: voiceprint
  cancel-in-progress: false

jobs:
  voiceprint:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      EPISODES: ${{ inputs.episodes }}
      LIMIT: ${{ inputs.limit || '20' }}
      FORCE: ${{ inputs.force }}
      PARALLEL: ${{ inputs.parallel || '4' }}
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Zainstaluj ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Cache pip i modeli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            .cache/voiceprint
            ~/.cache/torch
          key: voiceprint-${{ runner.arch }}-${{ hashFiles('scripts/voiceprint.py') }}

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install speechbrain numpy

      - name: Postęp przed przebiegiem
        run: node scripts/voiceprint-status.mjs

      - name: Wybierz odcinki
        id: plan
        run: node scripts/plan-voiceprint.mjs

      - name: Policz profile głosu
        if: steps.plan.outputs.count != '0'
        run: node scripts/run-voiceprint.mjs --parallel "$PARALLEL"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voiceprint
          path: voiceprint-out/*.voiceprint.json
          if-no-files-found: warn
          retention-days: 14

      - name: Zapisz wejścia w danych
        if: inputs.apply && steps.plan.outputs.count != '0'
        run: node scripts/import-voiceprint.mjs --write voiceprint-out/*.voiceprint.json

      - run: npm ci
        if: always() && inputs.apply

      - run: npm run check
        if: always() && inputs.apply

      - run: npm run build
        if: always() && inputs.apply

      - name: Postęp po przebiegu
        if: always()
        run: |
          node scripts/voiceprint-status.mjs
          node scripts/status-all.mjs

      - name: Commit i deploy
        if: always() && inputs.apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/push-data.sh "fix: wejścia z profilu głosu (${GITHUB_RUN_ID})" data/overrides data/voiceprint.json
          gh workflow run deploy.yml --ref main

      # Push mógł się nie udać mimo ponowień; wtedy praca i tak nie przepada —
      # poprawki da się pobrać z artefaktu i nałożyć ręcznie.
      - name: Zachowaj poprawki, gdy push się nie udał
        if: failure() && inputs.apply
        run: |
          git format-patch origin/main --stdout > voiceprint-push.patch || true
          test -s voiceprint-push.patch

      - uses: actions/upload-artifact@v5
        if: failure() && inputs.apply
        with:
          name: voiceprint-push
          path: voiceprint-push.patch
          if-no-files-found: ignore
