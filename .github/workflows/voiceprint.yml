name: voiceprint

# Profil głosu prowadzącego: Silero VAD + embeddingi ECAPA na całym odcinku.
# Wynik to artifact z blokami mowy i etykietą mówcy — na razie tylko analiza,
# nic nie trafia do data/ bez decyzji człowieka.

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: 'UUID lub slugi oddzielone przecinkami; puste = najnowsze wg LIMIT'
        required: false
        type: string
      limit:
        description: 'Ile odcinków (0 = bez limitu)'
        required: false
        default: '2'
        type: string
      max_spans:
        description: 'Limit bloków mowy na odcinek (0 = wszystkie) — do szybkich prób'
        required: false
        default: '0'
        type: string

run-name: "profil głosu: ${{ inputs.episodes || 'ostatnie odcinki' }}"

permissions:
  contents: read

concurrency:
  group: voiceprint
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  analyse:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      EPISODES: ${{ inputs.episodes }}
      LIMIT: ${{ inputs.limit }}
      MAX_SPANS: ${{ inputs.max_spans }}
    steps:
      - uses: actions/checkout@v7

      - name: Zainstaluj ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip i modeli
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            .cache/voiceprint
            ~/.cache/torch
          key: voiceprint-${{ runner.arch }}-${{ hashFiles('scripts/voiceprint.py') }}

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install speechbrain numpy

      - name: Wybierz odcinki
        run: node scripts/plan-voiceprint.mjs

      - name: Policz profile głosu
        run: |
          mkdir -p voiceprint-out
          while IFS=$'\t' read -r id url; do
            [ -z "$id" ] && continue
            echo "::group::$id"
            python scripts/voiceprint.py \
              --id "$id" --url "$url" \
              --episode "data/episodes/$id.json" \
              --transcript "data/transcripts/$id.json" \
              --max-spans "$MAX_SPANS" \
              --out "voiceprint-out/$id.voiceprint.json"
            echo "::endgroup::"
          done < ids.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voiceprint
          include-hidden-files: false
          path: voiceprint-out/*.voiceprint.json
          if-no-files-found: warn
          retention-days: 14
