name: repair

# Po każdym pushu do maina (i na żądanie) dokańcza to, czego automaty nie
# ustaliły: utwory bez tytułu albo z samym wykonawcą oraz wejścia z `#TODO`.
# Kolejność ma znaczenie — najpierw utwory, bo enrich bierze ich nazwy do opisu.
#
# `plan` liczy listę odcinków (gdy pusta, `repair` w ogóle nie startuje),
# a `repair` idzie macierzą — jeden node na odcinek, bo odcinki są od siebie
# niezależne: każdy pisze tylko swoje pliki i tylko one trafiają do commita.

on:
  push:
    branches: [main]
    paths: ['data/**']
  workflow_dispatch:
    inputs:
      episodes:
        description: 'UUID (też skrócony), slug albo prefiks, oddzielone przecinkami; puste = odcinki z brakami'
        required: false
        type: string

run-name: "naprawa braków: ${{ inputs.episodes || 'po pushu' }}"

permissions:
  contents: write
  actions: write

concurrency:
  # Przebieg naprawy to kilka minut pracy modeli i chromy — nowy push nie może go
  # anulować w połowie. Kolejny przebieg zaczeka i zacznie od świeżych danych,
  # więc zwykle znajdzie już tylko resztę.
  group: repair
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.find.outputs.count }}
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Wybierz odcinki
        id: find
        env:
          EPISODES: ${{ inputs.episodes }}
        run: |
          if [ -n "$EPISODES" ]; then
            printf '%s' "$EPISODES" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' > ids.txt
          else
            node scripts/needs-repair.mjs > ids.txt
          fi
          count=$(grep -c . ids.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # Pusta macierz wywala job, więc przy braku odcinków zostaje jedna pusta
          # kombinacja, którą odsiewa warunek na poziomie joba.
          if [ "$count" = "0" ]; then
            echo 'matrix={"episode":[{"id":""}]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0)) | map({id: .}) | {episode: .}' ids.txt)" >> "$GITHUB_OUTPUT"
          fi
          echo "Odcinków do naprawy: $count"
          sed 's/^/  /' ids.txt

  repair:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Każdy odcinek to własna rozmowa z modelem; za dużo naraz bije w limity
      # darmowych tierów, a `push-data.sh` i tak serializuje commity.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ID: ${{ matrix.episode.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ffmpeg czyta nagranie po HTTP i wycina fragment do porównania chromą.
      - name: Zainstaluj ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6
        with:
          python-version: '3.12'

      - run: pip install --quiet numpy
      - run: npm ci

      # `--retry-misses` tu nie chcemy: przebieg ma pomijać to, co już raz się nie udało.
      - name: Rozpoznaj utwory z kontekstu
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/resolve_tracks.py --episode "$ID" --write 2>&1 | tee resolve.log
          {
            echo "### Rozpoznane utwory: $ID"
            echo ""
            echo '```'
            tail -60 resolve.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Opisz wejścia
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/enrich-episode.mjs --episodes "$ID" --write

      - run: npm run check

      - name: Commit
        run: |
          bash scripts/push-data.sh "fix: naprawa utworów i wejść bez opisu ($ID, ${GITHUB_RUN_ID})" \
            data/episodes data/overrides data/reviewed.json data/titles.json

  # Macierz commituje kilka razy w jednym przebiegu; publikacja idzie raz, na końcu.
  deploy:
    needs: [plan, repair]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Deploy po naprawie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --quiet origin main
          if ! git log --oneline -30 --grep "(${GITHUB_RUN_ID})" origin/main | grep -q .; then
            echo "Brak commitów z tego przebiegu — nic do wdrożenia."
            exit 0
          fi
          gh workflow run deploy.yml --ref main -f version="$(node -p 'require("./package.json").version')"
