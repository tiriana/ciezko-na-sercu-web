name: transkrypcja tygodniowa

# Jedna audycja w tygodniu, po pobraniu nowych odcinków. Osobny workflow, bo nazwa
# przebiegu musi znać tytuł audycji, a `run-name` w transcribe.yml widzi tylko
# swoje wejścia — tutaj wybieramy odcinek i przekazujemy go razem z tytułem.
# Plan bierze najnowszy odcinek bez transkryptu, więc świeży materiał ma pierwszeństwo.

on:
  # Wtorkowe pobranie nowych audycji startuje 02:00 UTC, katalog odświeża się 04:00 UTC,
  # a transkrypcja rusza po nim — i to natychmiast, dispatchem z refresh-catalog.yml.
  # Ten cron jest tylko zapasem na wypadek, gdyby tamten dispatch nie doszedł.
  schedule:
    - cron: '30 4 * * 3'
  workflow_dispatch:

run-name: "wybór odcinka do transkrypcji"

permissions:
  actions: write
  contents: read

concurrency:
  group: transcribe-daily
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Wybierz następny odcinek
        id: next
        env:
          PRINT_NEXT: 'true'
        run: node scripts/plan-transcribe.mjs

      - name: Uruchom transkrypcję
        if: steps.next.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.next }}
          TITLE: ${{ steps.next.outputs.title }}
          REMAINING: ${{ steps.next.outputs.count }}
        run: |
          echo "Zostało $REMAINING odcinków, dziś: $TITLE ($NEXT)"
          gh workflow run transcribe.yml --ref main -f episodes="$NEXT" -f label="$TITLE"
