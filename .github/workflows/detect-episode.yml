name: wykrycie odcinka

# Środa, 00:05–03:00 czasu polskiego: sondowanie, czy nowy odcinek jest już
# opublikowany. Gdy wpis pojawi się na stronie, a plik audio odpowie, `check-audio.mjs`
# potwierdza publikację i dopiero wtedy leci `refresh-catalog.yml` — ten commituje
# katalog oraz zaślepkę opracowania, publikuje wpis i zamawia transkrypcję.
# Po transkrypcji `transcribe.yml` przelicza czasy i publikuje ponownie.
#
# Wpis i plik pojawiają się dopiero po audycji: ostatnie odcinki miały `Last-Modified`
# mp3 o 02:24 czasu lokalnego, czyli 24 minuty po końcu emisji — dlatego okno sięga
# 03:00, a o 04:17 UTC leci dosyłka, która nie podlega strażnikowi i łapie odcinek,
# jeśli środowe sondowanie go minie. GitHub gubi też część odpaleń crona, więc samo
# okno nie wystarcza.
#
# GitHub liczy crony w UTC, a Warszawa zmienia czas. Okno w UTC to wtorek
# 22:05 – środa 01:00 (CEST) albo wtorek 23:05 – środa 02:00 (CET), więc crony
# obejmują oba wieczory, a strażnik przepuszcza tylko przebieg w środowym oknie
# 00:05–03:00 czasu lokalnego. Przed 00:05 UTC jest jeszcze wtorek na zegarze,
# ale w Warszawie to już środa — dlatego dzień też liczymy lokalnie.
#
# Gdy pliku jeszcze nie ma, przebieg kończy się sukcesem: następne sondowanie
# za 10 minut ponowi próbę.

on:
  schedule:
    - cron: '*/10 22-23 * * 2' # początek okna: 00:05 CEST i 00:05 CET
    - cron: '*/10 0-2 * * 3' # koniec okna: 03:00 CEST (01:00 UTC) i 03:00 CET (02:00 UTC)
    - cron: '17 4 * * *' # dosyłka: łapie odcinek, gdy środowe sondowanie go minie
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Symuluj nowy odcinek (cała ścieżka bez czekania na publikację)'
        type: boolean
        default: false

run-name: wykrycie odcinka${{ inputs.simulate && ' (symulacja)' || '' }}

permissions:
  contents: read
  actions: write
  issues: write

# Sondowania i ręczne uruchomienie nie mogą iść równolegle: kolejne i tak nie
# znajdzie nowego odcinka, ale miałyby po co sięgać do sieci.
concurrency:
  group: detect-episode
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-26.04
    steps:
      - name: Strażnik pory (Europe/Warsaw)
        id: guard
        env:
          SIMULATE: ${{ inputs.simulate }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SIMULATE" = "true" ]; then
            echo "Symulacja: strażnik pominięty."
            exit 0
          fi
          if [ "$SCHEDULE" = "17 4 * * *" ]; then
            echo "Dosyłka dzienna: strażnik pominięty."
            exit 0
          fi
          day=$(TZ=Europe/Warsaw date +%u)
          time=$(TZ=Europe/Warsaw date +%H%M)
          if [ "$day" != "3" ] || [[ "$time" < "0005" ]] || [[ "$time" > "0300" ]]; then
            echo "Europe/Warsaw: dzień ${day}, ${time} — poza środowym oknem 00:05–03:00. Kończę."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.guard.outputs.skip != 'true'

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        if: steps.guard.outputs.skip != 'true'
        with:
          cache: true

      # HEAD zwykle wystarcza, ale gdy serwer nie poda długości, check-audio.mjs
      # pyta ffprobe. Obraz runnera ma ffmpeg, a gdyby nie miał — doinstalowujemy.
      - name: Zapewnij ffprobe (fallback sprawdzania audio)
        if: steps.guard.outputs.skip != 'true'
        run: command -v ffprobe >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Pobierz listę odcinków ze strony audycji
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/fetch-episodes.mjs .cache/episodes.json

      - name: Porównaj z katalogiem
        id: check
        if: steps.guard.outputs.skip != 'true'
        env:
          SIMULATE: ${{ inputs.simulate }}
        run: node scripts/detect-new-episode.mjs data/catalog.json .cache/episodes.json

      - name: Sprawdź, czy plik audio jest już udostępniony
        id: audio
        if: steps.check.outputs.new == 'true'
        env:
          IDS: ${{ steps.check.outputs.ids }}
        run: |
          if [ -z "$IDS" ]; then
            echo "Brak identyfikatorów (symulacja) — pomijam sprawdzanie audio."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for id in ${IDS//,/ }; do
            if ! node scripts/check-audio.mjs "$id"; then
              echo "Plik odcinka ${id} nie jest jeszcze udostępniony — następne sondowanie za 10 minut."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Podsumowanie
        if: steps.guard.outputs.skip != 'true'
        env:
          IS_NEW: ${{ steps.check.outputs.new }}
          COUNT: ${{ steps.check.outputs.count }}
          TITLES: ${{ steps.check.outputs.titles }}
          READY: ${{ steps.audio.outputs.ready }}
        run: |
          {
            echo "### Wykrycie odcinka"
            echo ""
            if [ "$IS_NEW" = "true" ]; then
              echo "Nowe odcinki: $COUNT"
              echo ""
              echo '```'
              printf '%s\n' "$TITLES"
              echo '```'
              echo ""
              if [ "$READY" = "true" ]; then
                echo "Plik audio jest dostępny — odświeżam katalog."
              else
                echo "Plik audio jeszcze nie jest udostępniony — czekam na kolejne sondowanie."
              fi
            else
              echo "Katalog aktualny — nic do zrobienia."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Odśwież katalog, opublikuj wpis i zamów transkrypcję
        if: steps.check.outputs.new == 'true' && steps.audio.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIMULATE: ${{ inputs.simulate }}
        run: |
          if [ "$SIMULATE" = "true" ]; then
            gh workflow run refresh-catalog.yml --ref main -f simulate=true
          else
            gh workflow run refresh-catalog.yml --ref main
          fi

  alert:
    # Zmiana formatu strony wyłącza wykrywanie po cichu, więc porażka musi być głośna.
    needs: detect
    if: failure()
    runs-on: ubuntu-26.04
    steps:
      - name: Zgłoś awarię wykrywania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Środowe wykrycie odcinka nie działa'
          body="Przebieg z $(date -u +%Y-%m-%dT%H:%MZ) zakończył się błędem: $RUN_URL"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
