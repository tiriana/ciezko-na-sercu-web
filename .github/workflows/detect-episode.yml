name: wykrycie odcinka

# Środa, 02:00–03:00 czasu polskiego: wpis odcinka i plik audio pojawiają się po
# emisji, ostatnie odcinki miały `Last-Modified` mp3 o 02:24. Wcześniej nie ma
# czego szukać, dlatego okno zaczyna się o 02:00.
#
# Okno w UTC obejmuje oba czasy: latem 02:00–03:00 CEST to 00:00–01:00 UTC, zimą
# 02:00–03:00 CET to 01:00–02:00 UTC, więc crony chodzą 00:00–02:00 UTC w środę,
# a strażnik w środku przebiegu sprawdza lokalną godzinę i kończy z adnotacją
# „za wcześnie" albo „za późno". Przed 00:05 UTC jest jeszcze wtorek na zegarze,
# ale w Warszawie to już środa — dlatego dzień też liczymy lokalnie.
#
# Gdy odcinek jest już w katalogu, przebieg kończy się adnotacją „odcinek został
# już wykryty" i nie sięga do sieci po audio. O 04:17 UTC w środę leci dosyłka,
# która nie podlega oknu i łapie odcinek, jeśli publikacja się nie zmieściła.
#
# Gdy wpis jest, a pliku jeszcze nie ma, przebieg kończy się sukcesem: następne
# sondowanie za 10 minut ponowi próbę.

on:
  schedule:
    - cron: '*/10 0-1 * * 3' # 02:00–03:00 czasu polskiego w obu czasach
    - cron: '17 4 * * 3' # dosyłka, gdy publikacja nie zmieściła się w oknie
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Symuluj nowy odcinek (cała ścieżka bez czekania na publikację)'
        type: boolean
        default: false

run-name: wykrycie odcinka${{ inputs.simulate && ' (symulacja)' || '' }}

permissions:
  contents: read
  actions: write
  issues: write

# Sondowania i ręczne uruchomienie nie mogą iść równolegle: kolejne i tak nie
# znajdzie nowego odcinka, ale miałyby po co sięgać do sieci.
concurrency:
  group: detect-episode
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-26.04
    steps:
      - name: Strażnik pory (Europe/Warsaw)
        id: guard
        env:
          SIMULATE: ${{ inputs.simulate }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SIMULATE" = "true" ]; then
            echo "Symulacja: strażnik pominięty."
            exit 0
          fi
          if [ "$SCHEDULE" = "17 4 * * 3" ]; then
            echo "::notice::Dosyłka — sprawdzam poza oknem."
            exit 0
          fi
          day=$(TZ=Europe/Warsaw date +%u)
          time=$(TZ=Europe/Warsaw date +%H%M)
          if [ "$day" != "3" ]; then
            echo "::notice::Dziś nie środa (dzień ${day}) — kończę."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$time" < "0200" ]]; then
            echo "::notice::Za wcześnie (${time}) — okno zaczyna się o 02:00."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$time" > "0300" ]]; then
            echo "::notice::Za późno (${time}) — okno kończy się o 03:00."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.guard.outputs.skip != 'true'

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        if: steps.guard.outputs.skip != 'true'
        with:
          cache: true

      # HEAD zwykle wystarcza, ale gdy serwer nie poda długości, check-audio.mjs
      # pyta ffprobe. Obraz runnera ma ffmpeg, a gdyby nie miał — doinstalowujemy.
      - name: Zapewnij ffprobe (fallback sprawdzania audio)
        if: steps.guard.outputs.skip != 'true'
        run: command -v ffprobe >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: Pobierz listę odcinków ze strony audycji
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/fetch-episodes.mjs .cache/episodes.json

      - name: Porównaj z katalogiem
        id: check
        if: steps.guard.outputs.skip != 'true'
        env:
          SIMULATE: ${{ inputs.simulate }}
        run: node scripts/detect-new-episode.mjs data/catalog.json .cache/episodes.json

      - name: Sprawdź, czy plik audio jest już udostępniony
        id: audio
        if: steps.check.outputs.state == 'new'
        env:
          IDS: ${{ steps.check.outputs.ids }}
        run: |
          if [ -z "$IDS" ]; then
            echo "Brak identyfikatorów (symulacja) — pomijam sprawdzanie audio."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for id in ${IDS//,/ }; do
            code=0
            node scripts/check-audio.mjs "$id" .cache/episodes.json || code=$?
            if [ "$code" = "0" ]; then
              continue
            fi
            if [ "$code" = "2" ]; then
              echo "::error::Nie umiem sprawdzić audio odcinka ${id} — to błąd w danych, nie brak publikacji."
              exit 1
            fi
            echo "Plik odcinka ${id} nie jest jeszcze udostępniony — następne sondowanie za 10 minut."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Podsumowanie
        if: steps.guard.outputs.skip != 'true'
        env:
          STATE: ${{ steps.check.outputs.state }}
          COUNT: ${{ steps.check.outputs.count }}
          TITLES: ${{ steps.check.outputs.titles }}
          READY: ${{ steps.audio.outputs.ready }}
        run: |
          {
            echo "### Wykrycie odcinka"
            echo ""
            case "$STATE" in
              new)
                echo "Nowe odcinki: $COUNT"
                echo ""
                echo '```'
                printf '%s\n' "$TITLES"
                echo '```'
                echo ""
                if [ "$READY" = "true" ]; then
                  echo "Plik audio jest dostępny — odświeżam katalog."
                else
                  echo "Plik audio jeszcze nie jest udostępniony — czekam na kolejne sondowanie."
                fi
                ;;
              known)
                echo "Odcinek jest już wykryty — nic do zrobienia."
                ;;
              *)
                echo "Nowego wpisu na stronie jeszcze nie ma — czekam na kolejne sondowanie."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          case "$STATE" in
            known) echo "::notice::Odcinek został już wykryty — nic do zrobienia." ;;
            new) : ;;
            *) echo "::notice::Nowego wpisu na stronie jeszcze nie ma." ;;
          esac

      - name: Odśwież katalog, opublikuj wpis i zamów transkrypcję
        if: steps.check.outputs.state == 'new' && steps.audio.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIMULATE: ${{ inputs.simulate }}
        run: |
          if [ "$SIMULATE" = "true" ]; then
            gh workflow run refresh-catalog.yml --ref main -f simulate=true
          else
            gh workflow run refresh-catalog.yml --ref main
          fi

  alert:
    # Zmiana formatu strony wyłącza wykrywanie po cichu, więc porażka musi być głośna.
    needs: detect
    if: failure()
    runs-on: ubuntu-26.04
    steps:
      - name: Zgłoś awarię wykrywania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Środowe wykrycie odcinka nie działa'
          body="Przebieg z $(date -u +%Y-%m-%dT%H:%MZ) zakończył się błędem: $RUN_URL"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
