name: Screenshots

on:
  workflow_dispatch:
    inputs:
      page:
        description: 'Ścieżka strony odcinka (kadr z playerem)'
        type: string
        default: '/odcinki/2026-11-04-sluchamy-umarlych/'

permissions:
  contents: read

# Własna grupa: push do main nie może anulować trwających zrzutów, a dwa uruchomienia
# zrzutów naraz tylko marnują minuty runnerów.
concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shots:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
        # WebKit na Windowsie nie kończy page.goto (timeout 60 s) niezależnie od fontów,
        # więc tej kombinacji nie ma w macierzy — reszta układów zostaje.
        exclude:
          - os: windows-latest
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Zainstaluj przeglądarkę (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Zainstaluj przeglądarkę (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Zrzut ekranu
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          PAGE: ${{ github.event.inputs.page }}
          OS_LABEL: ${{ matrix.os }}
          # Git Bash na Windows zamienia wartości zaczynające się od "/" na ścieżki
          # systemowe ("/odcinki" → "C:/Program Files/Git/odcinki") i psuło adres URL.
          MSYS2_ENV_CONV_EXCL: PAGE
          MSYS_NO_PATHCONV: '1'
        # Serwer statyczny startuje w scripts/screenshots.mjs; wcześniejsze tło powłoki
        # na Windowsie kończyło się "Could not connect to server".
        run: node scripts/screenshots.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shots-${{ matrix.os }}-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: error

  # v4 nie potrafi dopisywać do tego samego artefaktu z wielu zadań, więc zrzuty
  # zbieramy do jednej paczki dopiero tutaj.
  bundle:
    name: jedna paczka
    needs: shots
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: shots-*
          path: shots

      - name: Złóż paczkę
        run: |
          mkdir -p bundle
          find shots -name '*.png' -exec cp {} bundle/ \;
          ls -la bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: bundle/
          if-no-files-found: error
