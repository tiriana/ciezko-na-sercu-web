name: screenshots

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Ścieżki rozdzielone przecinkami'
        required: false
        default: '/,/odcinki/2024-05-01-ciezko-na-sercu-1-maja-godz-0005/'

permissions:
  contents: read

jobs:
  shots:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Zainstaluj przeglądarkę (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Zainstaluj przeglądarkę (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Zrzuty ekranu
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          PAGES: ${{ inputs.pages }}
        run: |
          npx --yes http-server dist -p 4321 --silent &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/ >/dev/null && break
            sleep 1
          done
          node scripts/screenshots.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: warn
