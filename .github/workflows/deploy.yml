name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Zrzuty ekranu (3 systemy × 3 przeglądarki)'
        type: boolean
        default: false
      screenshots_pages:
        description: 'Ścieżki do zrzutów, rozdzielone przecinkami'
        type: string
        default: '/,/odcinki/2024-05-01-ciezko-na-sercu-1-maja-godz-0005/'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  SURGE_DOMAIN: ciezko-na-sercu.surge.sh
  SURGE_VERSION: 0.56.0
  CF_PROJECT: ciezko-na-sercu
  WRANGLER_VERSION: 4.157.0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Zbuduj stronę
        run: npm run build

      - name: Opublikuj na Cloudflare Pages
        # Właściwy hosting. Numer konta bierzemy ze zmiennej repozytorium, a gdy jej nie ma —
        # z API; token nie musi wtedy być nigdzie dodatkowo konfigurowany.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            response=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts)
            CLOUDFLARE_ACCOUNT_ID=$(echo "$response" | jq -r '.result[0].id // empty')
            if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "::error::Nie udało się ustalić numeru konta Cloudflare. Ustaw zmienną repozytorium CLOUDFLARE_ACCOUNT_ID (dash.cloudflare.com → numer w adresie). Odpowiedź API: $response"
              exit 1
            fi
            export CLOUDFLARE_ACCOUNT_ID
            echo "Numer konta wykryty z API: $CLOUDFLARE_ACCOUNT_ID"
          fi
          # Projekt tworzymy raz; przy kolejnych przebiegach komenda zwraca błąd i go ignorujemy.
          npx --yes wrangler@$WRANGLER_VERSION pages project create "$CF_PROJECT" \
            --production-branch=main || true
          npx --yes wrangler@$WRANGLER_VERSION pages deploy dist \
            --project-name "$CF_PROJECT" --branch=main --commit-dirty=true

      - name: Opublikuj na Surge
        # Kopia zapasowa: Surge bywa niedostępny, więc jego błąd nie czerwieni całego przebiegu.
        continue-on-error: true
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx --yes surge@$SURGE_VERSION dist "$SURGE_DOMAIN"

  screenshots:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.screenshots == 'true'
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Zainstaluj przeglądarkę (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Zainstaluj przeglądarkę (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.browser }}

      - name: Zrzuty ekranu
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          PAGES: ${{ github.event.inputs.screenshots_pages }}
        run: |
          npx --yes http-server dist -p 4321 --silent &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/ >/dev/null && break
            sleep 1
          done
          node scripts/screenshots.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: warn
