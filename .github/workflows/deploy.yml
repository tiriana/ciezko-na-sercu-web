name: deploy

on:
  push:
    branches: [main, develop, v2]
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja do nazwy przebiegu (bez „v”)'
        required: false
        type: string

# Nazwa przebiegu mówi, którą wersję publikuje — bez tego lista wygląda jak „deploy #245”.
run-name: deploy ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Nie przerywamy publikacji w połowie: anulowany upload zostawiał stronę
  # przez chwilę na mieszance dwóch buildów. Lepiej poczekać w kolejce.
  cancel-in-progress: false

env:
  CF_PROJECT: ciezko-na-sercu
  WRANGLER_VERSION: 4.157.0

jobs:
  deploy:
    runs-on: ubuntu-26.04
    # develop to staging: build z tym samym kodem, ale bez indeksowania.
    env:
      STAGING: ${{ github.ref_name != 'main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          cache: true

      - name: Zainstaluj zależności
        run: npm ci

      - name: Zbuduj stronę
        run: npm run build

      - name: Opublikuj na Cloudflare Pages
        # Właściwy hosting. Numer konta bierzemy ze zmiennej repozytorium, a gdy jej nie ma —
        # z API; token nie musi wtedy być nigdzie dodatkowo konfigurowany.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            response=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts)
            CLOUDFLARE_ACCOUNT_ID=$(echo "$response" | jq -r '.result[0].id // empty')
            if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "::error::Nie udało się ustalić numeru konta Cloudflare. Ustaw zmienną repozytorium CLOUDFLARE_ACCOUNT_ID (dash.cloudflare.com → numer w adresie). Odpowiedź API: $response"
              exit 1
            fi
            export CLOUDFLARE_ACCOUNT_ID
            echo "Numer konta wykryty z API: $CLOUDFLARE_ACCOUNT_ID"
          fi
          # Projekt tworzymy raz; przy kolejnych przebiegach komenda zwraca błąd i go ignorujemy.
          npx --yes wrangler@$WRANGLER_VERSION pages project create "$CF_PROJECT" \
            --production-branch=main || true
          # Nazwa gałęzi wybiera adres: main to produkcja, develop — staging
          # na https://develop.<projekt>.pages.dev, v2 — nowy pipeline,
          # feat/** — podglądy.
          npx --yes wrangler@$WRANGLER_VERSION pages deploy dist \
            --project-name "$CF_PROJECT" --branch="$GITHUB_REF_NAME" --commit-dirty=true

      - name: Test dymny po publikacji
        # Tylko produkcja: develop ma własny adres (develop.<projekt>.pages.dev) i własną
        # wersję, więc porównywanie stopki z package.json na tej gałęzi nie ma sensu.
        if: github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://ciezko-na-sercu.pages.dev
          # Najstarszy odcinek w katalogu — stabilny adres, nie zniknie przy edycji listy.
          # Adres ma uuid, bo routing nie zależy od tytułu.
          EPISODE_PATH: /odcinki/4d8fa861/2024-05-01-ciezko-na-sercu-1-maja-godz-0005/
        run: |
          set -uo pipefail
          expected=$(node -p "require('./package.json').version")
          body=$(mktemp)
          echo "Oczekiwana wersja: $expected"

          for attempt in $(seq 1 18); do
            problems=""

            home_code=$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$BASE_URL/" || echo 000)
            if [ "$home_code" != 200 ]; then
              problems="$problems strona główna: HTTP $home_code."
            else
              grep -qF ">$expected</a>" "$body" \
                || problems="$problems w stopce brak wersji $expected."
              asset=$(grep -o '/_astro/[^"]*' "$body" | head -1)
              if [ -z "$asset" ]; then
                problems="$problems strona główna nie wskazuje pliku /_astro/."
              else
                asset_code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL$asset" || echo 000)
                [ "$asset_code" = 200 ] || problems="$problems $asset: HTTP $asset_code."
              fi
            fi

            episode_code=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL$EPISODE_PATH" || echo 000)
            [ "$episode_code" = 200 ] || problems="$problems $EPISODE_PATH: HTTP $episode_code."

            if [ -z "$problems" ]; then
              echo "Produkcja odpowiada i pokazuje wersję $expected (próba $attempt)."
              rm -f "$body"
              exit 0
            fi
            if [ "$attempt" = 18 ]; then
              echo "::error::Produkcja nie przeszła testu dymnego po 3 minutach:$problems"
              rm -f "$body"
              exit 1
            fi
            echo "Próba $attempt/18 — czekam 10 s:$problems"
            sleep 10
          done

  alert:
    # Nieudany deploy zostawia produkcję na starym albo mieszanym buildzie — musi być głośno.
    needs: deploy
    # Staging ma własny adres i własne wdrożenia; alert dotyczy tylko produkcji.
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Zgłoś nieudane wdrożenie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          title='Wdrożenie na produkcję nie działa'
          body="Przebieg z $(date -u +%Y-%m-%dT%H:%MZ) dla commita [$COMMIT](${{ github.server_url }}/${{ github.repository }}/commit/$COMMIT) na gałęzi \`$BRANCH\` zakończył się błędem: $RUN_URL"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
