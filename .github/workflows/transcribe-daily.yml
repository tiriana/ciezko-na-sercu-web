name: transkrypcja dzienna

# Jedna audycja dziennie z zaległości plus natychmiast nowa po publikacji. Osobny
# workflow, bo nazwa przebiegu musi znać tytuł audycji, a `run-name` w transcribe.yml
# widzi tylko swoje wejścia — tutaj wybieramy odcinek i przekazujemy go z tytułem.
# Plan bierze najnowszy odcinek bez transkryptu, więc świeży materiał ma pierwszeństwo.

on:
  # 12:00 UTC = zaległość o porze, gdy nikt nie czeka: środowe pobieranie (02:00 UTC)
  # i odświeżenie katalogu (04:00 UTC) mają własne wywołanie, więc nowy odcinek nie
  # stoi w kolejce za przebiegiem zaległości. Drugi cron to zapas na wypadek, gdyby
  # dispatch z refresh-catalog.yml nie doszedł.
  schedule:
    - cron: '0 12 * * *'
    - cron: '30 4 * * 3'
  workflow_dispatch:

run-name: "wybór odcinka do transkrypcji"

permissions:
  actions: write
  contents: read

concurrency:
  group: transcribe-daily
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Wybierz następny odcinek
        id: next
        env:
          PRINT_NEXT: 'true'
        run: node scripts/plan-transcribe.mjs

      - name: Uruchom transkrypcję
        if: steps.next.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.next }}
          TITLE: ${{ steps.next.outputs.title }}
          REMAINING: ${{ steps.next.outputs.count }}
        run: |
          echo "Zostało $REMAINING odcinków, dziś: $TITLE ($NEXT)"
          gh workflow run transcribe.yml --ref main -f episodes="$NEXT" -f label="$TITLE"
