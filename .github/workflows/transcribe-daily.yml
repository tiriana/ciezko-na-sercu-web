name: transkrypcja dzienna

# Jedna audycja dziennie z zaległości plus natychmiast nowa po publikacji. Osobny
# workflow, bo nazwa przebiegu musi znać tytuł audycji, a `run-name` w transcribe.yml
# widzi tylko swoje wejścia — tutaj wybieramy odcinek i przekazujemy go z tytułem.
# Plan bierze najnowszy odcinek bez transkryptu, więc świeży materiał ma pierwszeństwo.

on:
  # Zaległość: 12:00 UTC, czyli poza porą publikacji. Nowy odcinek nie ma tu cronu —
  # przychodzi dispatchem z refresh-catalog.yml, który uruchamia środowe wykrycie
  # odcinka (detect-episode.yml), gdy ze strony audycji widać wpis spoza katalogu.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

run-name: "wybór odcinka do transkrypcji"

permissions:
  actions: write
  contents: read

concurrency:
  group: transcribe-daily
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Wybierz następny odcinek
        id: next
        env:
          PRINT_NEXT: 'true'
        run: node scripts/plan-transcribe.mjs

      # Transkrypcja bierze podział z bloków mowy, więc najpierw VAD — on zamawia
      # transkrypcję sam, po commicie artefaktu.
      - name: Uruchom bloki mowy dla odcinka
        if: steps.next.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.next }}
          TITLE: ${{ steps.next.outputs.title }}
          REMAINING: ${{ steps.next.outputs.count }}
        run: |
          echo "Zostało $REMAINING odcinków, dziś: $TITLE ($NEXT)"
          gh workflow run spans.yml --ref main -f episodes="$NEXT"
